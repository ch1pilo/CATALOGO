<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .confirmation-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            text-align: center;
        }
        
        .confirmation-header {
            background-color: #4CAF50;
            color: white;
            padding: 30px 20px;
        }
        
        .confirmation-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .confirmation-header h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .confirmation-content {
            padding: 30px;
        }
        
        .confirmation-message {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .confirmation-details {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .confirmation-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-confirm {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-confirm:hover {
            background-color: #3e8e41;
        }
        
        .btn-cancel {
            background-color: #f1f1f1;
            color: #555;
        }
        
        .btn-cancel:hover {
            background-color: #e2e2e2;
        }
        
        .confirmation-footer {
            padding: 20px;
            background-color: #f9f9f9;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="confirmation-header">
            <div class="confirmation-icon">✓</div>
            <h2>Confirmar acción</h2>
            <p>Por favor revise los detalles a continuación</p>
        </div>
        
        <div class="confirmation-content">
            <p class="confirmation-message">
                Registro guardado exitosamente. Por favor confirme para continuar.
            </p>
            
            <div class="confirmation-details">
                <div class="detail-item">
                    <span>Accion:</span>
                    <span>{{accion}}</span>
                </div>
                <div class="detail-item">
                    <span>Nombre:</span>
                    <span>{{nombre}}</span>
                </div>
                <div class="detail-item">
                    <span>tipo:</span>
                    {% for tipo in tipos %}
                    <span>{{ tipo }}</span>
                    {% endfor %}
                </div>

            </div>
            
            <div class="confirmation-buttons">
                <a class="btn btn-confirm" href="{{url}}" >Confirmar</a>
            </div>
        </div>
    </div>  

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const confirmBtn = document.querySelector('.btn-confirm');
            const cancelBtn = document.querySelector('.btn-cancel');
            
            confirmBtn.addEventListener('click', function() {
                alert('¡Acción confirmada!');
                // Aquí iría la lógica para procesar la confirmación
            });
            
           
        });
    </script>
</body>
</html>
