{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EmpiShoes</title>
    <link rel="stylesheet" href="{% static 'catalogoGeneral/css/catalogo.css' %}">
    <link rel="stylesheet" href="{% static 'catalogoGeneral/css/styleLogin.css' %}"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'catalogoGeneral/css/menudesplegable.css' %}">


</head>

<body>

    <header>
        <div class="header-container">
            <div class="logo"><img src="{% static 'img/logoPng.webp' %}">EMpi<span>Shoes</span></div>
            <nav>
                <button class="menu-toggle" id="menu-toggle">☰</button>
                <div class='sub-menu' id="mobile-menu">
                    <ul>
                        <li><a href="{% url 'catalogo_principal' %}">Zapatos</a></li>
                        <li><a href="{% url 'catalogo_Ropa' %}">Ropa</a></li>
                        <li><a href="{% url 'catalogo_accesorio' %}">Accesorios</a></li>
                        <li><a href="{% url 'catalogo_descuento' %}">Ofertas</a></li>
                        <li><a href="#">Contacto</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta de EMPI Shoes</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form class="auth-form" method="POST" action="{% url 'logear' %}">
                {% csrf_token %}
                <div class="form">
                    <label for="username">Usuario o Email</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>

            <div class="auth-links">
            </div>
        </div>
    </main>
    <script src="{% static 'catalogoGeneral/js/menu.js' %}"></script>
</body>
</html>
