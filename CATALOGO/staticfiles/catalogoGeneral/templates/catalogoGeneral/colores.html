{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Catálogo</title>
    <link rel="stylesheet" href="{% static 'catalogoGeneral/css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>Gestión de Catálogo</h1>
            </div>
        </div>
    </header>

    <div class="container">
        <ul class="nav-tabs">
            <li><a href="{% url 'gestion_marcas' %}" class="tab-link ">Marcas</a></li>
            <li><a href="{% url 'gestion_modelos' %}" class="tab-link ">Modelos</a></li>
            <li><a href="{% url 'gestion_colores' %}" class="tab-link active">Colores</a></li>
            <li><a href="{% url 'gestion_tallas' %}" class="tab-link">Tallas</a></li>
            <li><a href="{% url 'gestion_productos' %}" class="tab-link">Productos</a></li>
        </ul>
        
        <div class="alert" id="alert-box" style="display: none;"></div>

        <!-- Sección Colores -->
        <div id="colores" class="tab-content active">
            <h2>Gestión de Colores</h2>
            <form id="form-color" action="{% url 'guardar_color' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="color-nombre">Nombre del Color</label>
                    <input type="text" id="color-nombre" name="color-nombre" required>
                </div>
                <div class="form-group">
                    <label for="color-codigo">Código HEX (opcional)</label>
                    <input type="color" id="color-codigo" name="colores_hex" value="#ffffff">
                </div>
                <button type="submit">Guardar Color</button>
            </form>
            
            <h3>Colores Existentes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Código</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-colores">
                    {% for color in colores %}
                    <tr>
                        <td>{{ color.id }}</td>
                        <td>{{ color.nombre }}</td>
                        <td style="background-color: {{ color.codigo_hex }};">{{ color.codigo }}</td>
                        <td>
                            <button class="btn-edit" data-id="{{ color.id }}">Editar</button>
                            <button class="btn-delete" data-id="{{ color.id }}">Eliminar</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>


    </div>
</body>
</html>
